# Builds the Quizzarr Docker image and publishes it on GitHub (ghcr.io/frankless/quizzarr).
#
# - Every push to main: tests, then the "latest" image (plus a "sha-xxxxxxx" image to roll back).
# - Release: Actions tab → "Image Docker" → "Run workflow" with a number (e.g. 1.0.0),
#   or push a v1.0.0 tag: also publishes the "1.0.0" and "1.0" images.
name: Image Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to publish, without the v (e.g. 1.0.0). Empty = latest only."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version number
        id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then V="${INPUT#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V=""; fi
          if [ -n "$V" ] && ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version number: $V (expected: 1.2.3)"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
          echo "label=${V:-main-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/frankless/quizzarr
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.version != '' }}
            type=raw,value=${{ steps.v.outputs.minor }},enable=${{ steps.v.outputs.version != '' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.label }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
